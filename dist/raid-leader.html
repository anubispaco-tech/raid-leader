<title>副本團長</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 手機優先的「公會作戰桌」——頂部資源列、單欄內容、底部分頁列；刻意單一深色主題（夜間火把下的石板＋黃銅） */
:root{
  color-scheme: dark;
  --bg:#12161d; --panel:#1b212b; --panel2:#222a36; --line:#2e3846; --fg:#e8e2d2; --muted:#8e97a6; --dim:#5d6676;
  --brass:#d0a44c; --brass-d:#8a6a2a; --ink:#12161d;
  --tank:#5d8ff0; --heal:#4fc17f; --dps:#e3664f; --warn:#f0b54a; --bad:#e5534b; --good:#57c78a;
  --r0:#9ca3af; --r1:#38c172; --r2:#4b8df5; --r3:#b46cf2;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%, #2a2416 0%, transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 150px}

/* 頂部資源列 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.08em;color:var(--brass);white-space:nowrap;background:none;border:0;padding:4px 2px;display:flex;align-items:center;gap:6px;cursor:pointer}
.brand .gear{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.brand:active{opacity:.7}
.res{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
.res .pill{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.coin{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,var(--brass) 60%,var(--brass-d))}
.idlechip{font-size:12px;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 50%,transparent);border-radius:999px;padding:2px 8px;white-space:nowrap}
.idlechip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:22px 0 4px;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* 副本卡 */
.dlist{display:grid;gap:10px}
.dg{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px}
.dg.locked{opacity:.45}
.dg .tier{grid-row:span 3;font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--brass);text-align:center;line-height:1;padding-top:4px;border-right:1px solid var(--line)}
.dg .tier small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-top:4px}
.dg h3{margin:0;font-size:17px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dg h3 .boss{font-size:13px;color:var(--muted);font-weight:500}
.dg .tip{font-size:13px;color:var(--fg);opacity:.85}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:500}
.meta .ok{color:var(--good)} .meta .low{color:var(--warn)}
.dg .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--dim)}
.btn.main{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
.btn.main:hover{filter:brightness(1.08)}
.btn.on{border-color:var(--good);color:var(--good)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.grow{flex:1}

/* 戰鬥 */
.bhead{display:flex;align-items:center;gap:10px;margin-top:16px}
.bhead h2{margin:0;font-size:19px}
.waves{display:flex;gap:4px;margin-left:auto}
.waves i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.waves i.done{background:var(--brass-d)} .waves i.cur{background:var(--brass)}
.arena{display:grid;gap:14px;margin-top:12px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.unit{display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px;align-items:center}
.unit .ic{grid-row:span 2;font-size:18px;text-align:center}
.unit .nm{font-size:13px;display:flex;gap:6px;align-items:baseline}
.unit .nm small{color:var(--muted);font-size:11px}
.unit .hpn{font-size:11px;color:var(--muted)}
.bar{grid-column:2/-1;height:8px;background:#0d1015;border-radius:4px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .25s}
.unit.dead{opacity:.35}
.unit.boss .bar{height:12px}
.role-tank{background:var(--tank)} .role-heal{background:var(--heal)} .role-dps{background:var(--dps)}
.enemy-bar{background:linear-gradient(90deg,#9b3a2e,var(--bad))}
.log{margin-top:12px;background:#0e1117;border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:150px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.log p{margin:0;color:var(--muted)} .log .t{font-family:var(--f-num);color:var(--dim);margin-right:6px}
.log .good{color:var(--good)} .log .bad{color:var(--bad)} .log .warn{color:var(--warn)} .log .info{color:var(--brass)}
.ctrl{display:flex;gap:6px;flex-wrap:nowrap;max-width:560px;margin:0 auto;padding:0 16px}
.ctrl .btn{flex:1;white-space:nowrap}
/* 戰鬥控制列固定在分頁列上方，不隨戰鬥內容位移 */
.ctrlbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5;padding:8px 0;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.side.foes{min-height:calc(26px + 4 * 34px);align-content:start}
.more{font-size:12px;color:var(--muted);padding-left:34px}
.stashbox{background:var(--panel);border:1px solid var(--brass-d);border-radius:10px;padding:12px;display:grid;gap:10px;margin-bottom:12px}
.settings{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;font-size:14px}
.warnc{color:var(--warn)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;font-family:var(--f-num)}
.seg button.sel{background:var(--brass);color:var(--ink);font-weight:700}

.result{background:var(--panel);border:1px solid var(--brass-d);border-radius:12px;padding:16px;margin-top:14px;display:grid;gap:12px}
.result h3{margin:0;font-family:var(--f-display);font-size:24px}
.result.win h3{color:var(--brass)} .result.lose h3{color:var(--bad)}
.rew{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.meter{display:grid;gap:5px}
.mrow{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.mrow .mb{height:14px;background:#0d1015;border-radius:3px;overflow:hidden}
.mrow .mb i{display:block;height:100%}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:10px;margin-top:16px}

/* 團隊 */
.party{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.slot.emptyslot{border-style:dashed;color:var(--dim);display:grid;place-items:center;font-size:12px}
.slot .ic{font-size:22px}
.slot .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .lv{font-size:11px;color:var(--muted)}
.slot .rl{height:3px;border-radius:2px;margin:6px 8px 0}
.comp{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:8px 0 0;flex-wrap:wrap}
.comp b{font-weight:500}
.hero{display:grid;grid-template-columns:36px 1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.hero .ic{grid-row:span 2;font-size:22px;text-align:center}
.hero .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hero .nm small{font-weight:400;color:var(--muted);font-size:12px}
.hero .st{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.hero .tag{grid-row:span 2;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.hero .tag.in{border-color:var(--brass-d);color:var(--brass)}
.stack{display:grid;gap:8px}
.xpbar{height:3px;background:#0d1015;border-radius:2px;overflow:hidden;grid-column:2/-1;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--brass-d)}

/* 背包 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:9px 12px;text-align:left;width:100%}
.item .in{font-weight:500;font-size:14px}
.item .is{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.item .il{grid-row:span 2;align-self:center;font-size:12px;color:var(--muted);text-align:right}
.item .il b{display:block;font-size:16px;color:var(--fg)}
.rar0{border-left-color:var(--r0)} .rar1{border-left-color:var(--r1)} .rar2{border-left-color:var(--r2)} .rar3{border-left-color:var(--r3)}
.c0{color:var(--r0)} .c1{color:var(--r1)} .c2{color:var(--r2)} .c3{color:var(--r3)}
.up{color:var(--brass);font-family:var(--f-num);font-size:12px;margin-left:4px}
.better{color:var(--good);font-size:11px;font-weight:700;margin-left:6px}

/* 底部分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{padding:9px 0 8px;font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:2px;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabs button.sel{color:var(--brass)}
.tabs button .dot{position:absolute;top:6px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--good)}

/* 底部抽屜 */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:86%;overflow-y:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet.anim{animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0;font-family:var(--f-display);font-size:21px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.statgrid div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
.statgrid b{display:block;font-size:16px}
.statgrid span{font-size:11px;color:var(--muted)}
.gearrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gearrow .sl{font-size:12px;color:var(--muted)}
.choices{display:grid;gap:6px;max-height:260px;overflow-y:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--brass-d);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20;white-space:nowrap;animation:rise .2s}
textarea{width:100%;min-height:90px;font-size:16px!important;background:#0e1117;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-num);font-size:11px}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.howto b{color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.3 天賦與技能 */
.seg.wide{display:grid;grid-template-columns:1fr 1fr}
.seg.wide button{padding:8px;font-family:var(--f-body);font-size:14px}
.pip{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--good);color:var(--ink);font-size:11px;margin-left:6px;font-family:var(--f-num)}
.skillcard{display:grid;gap:2px;background:var(--panel2);border-radius:8px;padding:10px 12px}
.trow{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:stretch}
.trow.locked{opacity:.45}
.tlv{font-size:13px;color:var(--brass);display:grid;align-content:center;line-height:1.2}
.tlv small{font-family:var(--f-body);font-size:10px;color:var(--muted)}
.opt{display:grid;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.opt b{font-size:13px}
.opt span{font-size:11.5px;color:var(--muted);line-height:1.35}
.opt.sel{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,var(--panel2))}
.opt.sel b{color:var(--brass)}
.opt[disabled]{cursor:not-allowed}
.newpick{font-size:11px;color:var(--ink);background:var(--good);border-radius:999px;padding:1px 7px;font-weight:500}
.mrow small{display:block;color:var(--muted);font-size:10.5px}
.log .skill{color:#b9a77e}
.btn.horn{flex:0 0 auto;padding-inline:12px}
.btn.horn.on{border-color:var(--brass);color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,var(--panel2))}

/* v0.4 傳奇秘境、傳說品質、下一步建議 */
:root{--r4:#f59e0b}
.rar4{border-left-color:var(--r4);box-shadow:inset 3px 0 12px -6px var(--r4)} .c4{color:var(--r4)}
.nextstep{display:flex;gap:12px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--good) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--good) 45%,var(--line));border-radius:10px;padding:12px 14px;margin-top:16px}
.nextstep>div{display:grid;gap:2px;min-width:0}
.nextstep .label{color:var(--good)}
.nextstep .btn{flex:0 0 auto}
.mythic{background:linear-gradient(160deg,color-mix(in srgb,var(--r4) 12%,var(--panel)),var(--panel) 60%);border:1px solid color-mix(in srgb,var(--r4) 45%,var(--line));border-radius:12px;padding:14px;display:grid;gap:12px;margin-bottom:16px}
.mythic.locked{background:var(--panel);border-color:var(--line);opacity:.7;gap:4px}
.mhead{display:flex;align-items:center;justify-content:space-between}
.mhead>div{display:grid}
.mhead b{font-family:var(--f-display);font-size:18px}
.keystone{display:inline-grid;place-items:center;min-width:52px;padding:4px 10px;border-radius:999px;background:var(--r4);color:var(--ink);font-weight:700;font-size:20px}
.keystone.sm{min-width:0;font-size:13px;padding:1px 8px;vertical-align:middle}
.keystone.up{background:var(--good)} .keystone.down{background:var(--bad);color:#fff}
.affixes{display:grid;gap:4px}
.affix{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;opacity:.5;min-width:0}
.affix.on{opacity:1;border-color:color-mix(in srgb,var(--r4) 60%,var(--line))}
.affix b{font-size:14px;color:var(--r4);min-width:44px} .affix span{font-size:12px;color:var(--fg);line-height:1.35;min-width:0} .affix small{font-size:10.5px;color:var(--muted);text-align:right;max-width:110px}
.mlist{display:grid;gap:6px}
.mrow2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;background:var(--panel2);border-radius:8px;padding:8px 10px}
.mname{display:grid;min-width:0}
.mname b{font-size:14px}
.mtimer{display:flex;align-items:center;gap:10px;margin-top:10px}
.mtrack{flex:1;height:8px;background:#0d1015;border-radius:4px;position:relative;overflow:hidden}
.mtrack i{position:absolute;inset:0 auto 0 0;background:var(--r4);border-radius:4px;transition:width .25s}
.mtrack em{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.5}
.mtimer span{font-size:13px;min-width:72px;text-align:right}
.mtimer.over .mtrack i{background:var(--bad)} .mtimer.over span{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--r4) 60%,var(--line));color:var(--r4)}
.keychange{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.keychange .arrow{color:var(--muted)}
.newrec{font-size:12px;background:var(--brass);color:var(--ink);border-radius:999px;padding:2px 8px;font-weight:700}

/* v0.5 排行榜、暱稱、回饋 */
.inp{width:100%;background:#0e1117;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;font-family:var(--f-body)}
.inp:focus,.fb:focus{outline:2px solid var(--brass);outline-offset:1px}
textarea.fb{min-height:96px;font-family:var(--f-body);font-size:16px!important;line-height:1.5}
.boardcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;margin-top:16px}
.board{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.board li{display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;background:var(--panel2);font-size:14px}
.board li:nth-child(-n+3) .rk{color:var(--brass);font-weight:700}
.board li.me{outline:1px solid var(--brass)}
.board b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{color:var(--brass);text-decoration:underline;font-size:13px;padding:0}

/* v0.6 */
.selwrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.selwrap select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.okc{color:var(--good)}

/* v0.7 稀有度、招募、寶庫 */
.rtag{font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:middle}
.rtag.r0{color:var(--r0)} .rtag.r1{color:var(--r1)} .rtag.r2{color:var(--r2)} .rtag.r3{color:var(--r3)} .rtag.r4{color:var(--r4)}
.hero.r-1,.slot.r-1,.drawcard.r-1{border-color:color-mix(in srgb,var(--r1) 45%,var(--line))}
.hero.r-2,.slot.r-2,.drawcard.r-2{border-color:color-mix(in srgb,var(--r2) 55%,var(--line))}
.hero.r-3,.slot.r-3,.drawcard.r-3{border-color:color-mix(in srgb,var(--r3) 65%,var(--line))}
.hero.r-4,.slot.r-4,.drawcard.r-4{border-color:var(--r4);box-shadow:0 0 14px -6px var(--r4)}
.hero.unowned{opacity:.55}
.raritycard{display:grid;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px}
.recruit{display:grid;gap:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--r3) 12%,var(--panel)),var(--panel) 60%);border:1px solid color-mix(in srgb,var(--r3) 45%,var(--line));border-radius:12px;padding:14px}
.recruit>div:first-child{display:grid;gap:2px}
.rates{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px}
.drawlist{display:grid;gap:6px;max-height:55vh;overflow-y:auto}
.drawcard{display:grid;grid-template-columns:28px 1fr auto;gap:2px 8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.drawcard small{grid-column:2/-1;font-size:11.5px;color:var(--muted)}
.drawcard .ic{grid-row:span 3;font-size:20px;text-align:center}
.vault{background:linear-gradient(160deg,color-mix(in srgb,var(--brass) 14%,var(--panel)),var(--panel) 60%);border:1px solid color-mix(in srgb,var(--brass) 50%,var(--line));border-radius:12px;padding:14px;display:grid;gap:10px;margin-top:16px}
.vault.locked{background:var(--panel);border-color:var(--line);opacity:.7;gap:4px}
.vleft{font-size:13px;color:var(--brass)}
.vfloors{display:grid;grid-template-columns:repeat(7,1fr)}
.vfloors button{padding:6px 0}
.vaultcount{margin-top:6px;font-size:14px}

.mrow2 .mname{flex:1 1 100%}
.dust{color:#7fd3e6}

/* ---------- 開始畫面 ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;

#title.out{opacity:0;pointer-events:none}
#title .tbox{display:grid;justify-items:center;gap:14px;text-align:center;max-width:360px;width:100%}
#title .tlogo{font-family:var(--f-display);font-weight:900;font-size:44px;letter-spacing:.12em;color:var(--brass);text-shadow:0 2px 18px rgba(208,164,76,.35)}

#title .ttag{color:var(--fg);margin:8px 0 10px;opacity:.85}
#title .tgo{width:100%;font-size:17px;padding:14px}
#title .tlang{margin-top:6px}
#title .tver{margin:6px 0 0}

.dlg{display:grid;gap:10px;cursor:pointer;min-height:150px}

.trow.n3{grid-template-columns:44px 1fr}.trow.n3 .opt{grid-column:2}.trow.n3 .tlv{grid-row:span 3}
.seg.modes{margin:14px 0 4px}.seg.modes button{flex:1}.seg.chapters{margin:6px 0 10px}.seg.chapters button{flex:1;font-size:13px}.seg button[disabled]{opacity:.45}

    "\u683C\u5F0F\u4E0D\u7B26": "Invalid format",
    "\u908A\u5883\u516C\u6703\u7684\u61F8\u8CDE\u699C\u4E0A\uFF0C\u8CBC\u6EFF\u4E86\u526F\u672C\u7684\u59D4\u8A17\u3002": "The frontier guild's bounty board is covered in dungeon contracts.",
    "\u516C\u6703\u66F8\u8A18": "Guild Clerk",
    "\u65B0\u4F86\u7684\u5718\u9577\uFF1F\u5148\u5F9E\u8150\u6839\u6D1E\u7A9F\u958B\u59CB\u5427\uFF0C\u90A3\u88E1\u7684\u8611\u83C7\u9818\u4E3B\u6700\u8FD1\u4E0D\u592A\u5B89\u5206\u3002": "You're the new raid leader? Start with Rotroot Cavern \u2014 the Mushroom Lord has been restless lately.",
    "\u968A\u4F0D\u6211\u5E6B\u4F60\u6E4A\u4E86\u4E09\u500B\u4EBA\u3002\u4EBA\u624B\u4E0D\u5920\uFF0C\u5C31\u53BB\u9152\u9928\u627E\u3002": "I've rounded up three for your party. Need more hands? Try the Tavern.",
    "\u5C0D\u4E86\u2014\u2014\u6700\u4E0A\u9762\u90A3\u5F35\u5C60\u9F8D\u4EE4\uFF0C\u7B49\u4F60\u5011\u5920\u5F37\u518D\u8AAA\u3002": "Oh, and that dragon-slaying writ at the very top? Not until you're strong enough.",
    "\u5B88\u5854\u4EBA\u30FB\u6B50\u6797": "Orin, Spirekeeper",
    "\u7D05\u9F8D\u5012\u4E0B\u7684\u90A3\u4E00\u523B\uFF0C\u9F8D\u7720\u9AD8\u5854\u7684\u5730\u57FA\u88C2\u958B\u4E86\u4E00\u9053\u7E2B\u3002": "The moment the red dragon fell, a crack split the foundations of Dragonsleep Spire.",
    "\u4F60\u5011\u6BBA\u4E86\u9F8D\uFF1F\u2026\u2026\u7260\u7761\u5728\u5854\u9802\uFF0C\u662F\u70BA\u4E86\u7528\u8EAB\u9AD4\u58D3\u4F4F\u5854\u5E95\u7684\u88C2\u8C37\u3002": "You killed the dragon? \u2026It slept atop the spire to hold the rift beneath shut with its own body.",
    "\u6211\u662F\u5B88\u5854\u4EBA\u6B50\u6797\u3002\u5C01\u5370\u5D29\u4E86\uFF0C\u88C2\u8C37\u9072\u65E9\u6703\u5168\u958B\u3002": "I'm Orin, keeper of the spire. The seal is broken \u2014 sooner or later the rift will tear wide open.",
    "\u9084\u6709\u4E00\u4EF6\u4E8B\u2014\u2014\u90A3\u5F35\u5C60\u9F8D\u4EE4\uFF0C\u5230\u5E95\u662F\u8AB0\u8CBC\u5728\u516C\u6703\u699C\u4E0A\u7684\uFF1F": "And one more thing \u2014 who posted that dragon-slaying writ on the guild board?",
    "\u77F3\u9C57\u5B88\u885B\u672C\u4F86\u662F\u5B88\u5C01\u5370\u7684\uFF0C\u73FE\u5728\u6C92\u4E86\u4E3B\u4EBA\uFF0C\u898B\u4EBA\u5C31\u6253\u3002": "The Stonescale Warden once guarded the seal. Masterless now, it attacks anyone.",
    "\u5C0F\u5FC3\u7260\u7684\u8A5B\u5492\u3002\u8B93\u6CBB\u7642\u96A8\u6642\u6E96\u5099\u6DE8\u5316\u3002": "Watch for its curses. Keep your healer ready to dispel.",
    "\u88C2\u7E2B\u9084\u5728\u5F80\u4E0B\u5EF6\u4F38\u2026\u2026\u662F\u5F9E\u7926\u8108\u90A3\u908A\u4F86\u7684\u3002": "The crack keeps going down\u2026 it's coming from the lode.",
    "\u7B2C II \u5C64\u5931\u8E64\u7684\u7926\u5DE5\u2026\u2026\u539F\u4F86\u90FD\u5728\u9019\u88E1\u3002": "The miners who vanished from Floor II\u2026 so this is where they went.",
    "\u9B42\u9444\u5320\u8B80\u689D\u6642\u4E00\u5B9A\u8981\u6253\u65B7\uFF0C\u4E0D\u7136\u6574\u968A\u90FD\u6703\u88AB\u9707\u98DB\u3002": "Interrupt the Soulsmith's casts, or the whole party gets blown apart.",
    "\u796D\u53F8\u5011\u8981\u7684\u9748\u9B42\uFF0C\u6211\u5DF2\u7D93\u4EA4\u4E86\u2026\u2026\u4F60\u5011\u4F86\u665A\u4E86\u3002": "I've already delivered the souls the priests wanted\u2026 you're too late.",
    "\u5148\u77E5\u5011\u8AAA\u4F60\u5011\u6703\u4F86\u3002\u4F60\u5011\u5DF2\u7D93\u505A\u5B8C\u4F60\u5011\u8A72\u505A\u7684\u4E8B\u4E86\u3002": "The prophets said you would come. You've already done your part.",
    "\u4ED6\u7684\u8B77\u76FE\u5F88\u786C\u3002\u5341\u79D2\u5167\u6253\u4E0D\u7834\uFF0C\u4ED6\u5C31\u6703\u56DE\u8840\u3002": "His shield is tough. If you can't break it in ten seconds, he heals.",
    "\u5148\u77E5\uFF1F\u2026\u2026\u61F8\u8CDE\u4EE4\u4E0A\u7684\u7F72\u540D\uFF0C\u5C31\u662F\u300C\u96D9\u6708\u300D\u3002": 'Prophets? \u2026The writ was signed "Twin Moons."',
    "\u518D\u5F80\u4E0B\u662F\u96D9\u6708\u738B\u5EA7\u3002\u6211\u5148\u53BB\u63A2\u8DEF\uFF0C\u7B49\u6211\u6D88\u606F\u3002": "Below lies the Twin Moon Throne. I'll scout ahead \u2014 wait for word.",
    "\u8B1D\u8B1D\u4F60\u5011\u66FF\u6211\u5011\u6BBA\u4E86\u9F8D\u3002": "Thank you for killing the dragon for us.",
    "\u5C01\u5370\u4E00\u788E\uFF0C\u6211\u5011\u7684\u4E3B\u4EBA\u5C31\u80FD\u56DE\u4F86\u4E86\u3002": "With the seal shattered, our master can return.",
    "\u5169\u500B\u4E00\u8D77\u4E0A\uFF01\u5E36\u5169\u500B\u625B\u5F97\u4F4F\u7684\u4EBA\uFF0C\u5404\u770B\u4F4F\u4E00\u96BB\uFF0C\u8840\u91CF\u8981\u4E00\u8D77\u58D3\u3002": "Both at once! Bring two who can take hits, one on each \u2014 and wear them down together.",
    "\u5C01\u5370\u9084\u80FD\u88DC\u2014\u2014\u9700\u8981\u51B0\u6676\u5973\u7687\u624B\u4E0A\u7684\u5C01\u5370\u788E\u7247\u3002": "The seal can still be mended \u2014 we need the shard the Crystal Empress holds.",
    "\u6211\u51CD\u4F4F\u81EA\u5DF1\u5B88\u4E86\u4E09\u767E\u5E74\u2026\u2026\u6211\u5DF2\u7D93\u5206\u4E0D\u6E05\u8AB0\u662F\u6575\u4EBA\u3002": "I froze myself to stand guard for three hundred years\u2026 I can no longer tell friend from foe.",
    "\u2026\u2026\u62FF\u53BB\u3002\u628A\u5B83\u95DC\u4E0A\u3002": "\u2026Take it. Close it.",
    "\u4F60\u5011\u5F97\u5230\u4E86\u5C01\u5370\u788E\u7247\u3002": "You obtained the seal shard.",
    "\u9580\u5DF2\u7D93\u958B\u4E86\uFF0C\u5C0F\u5C0F\u7684\u5C01\u5370\u5E2B\u3002": "The gate is already open, little sealer.",
    "\u4ED6\u8840\u91CF\u4E00\u4F4E\u5C31\u6703\u767C\u72C2\uFF0C\u865F\u89D2\u7559\u5230\u5F8C\u534A\u6BB5\u518D\u5439\u3002": "He goes berserk when wounded \u2014 save the horn for the second half.",
    "\u6700\u5F8C\u4E00\u6BB5\u8DEF\u4E86\u3002": "This is the last stretch.",
    "\u9F8D\u6B7B\u4E86\uFF0C\u6C92\u6709\u4EBA\u80FD\u518D\u95DC\u4E0A\u9019\u6247\u9580\u3002": "The dragon is dead. No one can close this door again.",
    "\u5C01\u5370\u788E\u7247\u2026\u2026\u653E\u9032\u53BB\u4E86\uFF01": "The shard\u2026 it's in!",
    "\u88C2\u8C37\u7DE9\u7DE9\u95D4\u4E0A\uFF0C\u53EA\u5269\u6DF1\u8655\u50B3\u4F86\u7684\u4F4E\u9CF4\u3002": "The rift slowly closes, leaving only a low hum from the depths.",
    "\u5C01\u5370\u53EA\u64CB\u4F4F\u4E86\u4E3B\u9AD4\uFF0C\u6B98\u97FF\u9084\u6703\u4E00\u76F4\u6EB6\u51FA\u4F86\u2014\u2014\u90A3\u4E9B\u6B98\u97FF\uFF0C\u5C31\u662F\u4F60\u5011\u4E4B\u5F8C\u8981\u9762\u5C0D\u7684\u79D8\u5883\u3002": "The seal holds back the main body, but echoes will keep seeping out \u2014 those echoes are the Mythic dungeons you'll face.",
    "\u7B2C\u4E8C\u7AE0\u300C\u6DF1\u6DF5\u88C2\u8C37\u300D\u5B8C\u3002": "End of Chapter II: The Abyssal Rift.",

          toast(tx("\u8ACB\u5148\u8F38\u5165\u610F\u898B"));
          return;
        }
        t.disabled = true;
        sendFeedback(text).then((r) => {
          if (r && r.ok) {
            app.fbDraft = "";
            ta.value = "";
            toast(tx("\u5DF2\u9001\u51FA\uFF0C\u8B1D\u8B1D\u56DE\u994B\uFF01"));
          } else toast(r && r.error === "too fast" ? tx("\u9001\u592A\u5FEB\u4E86\uFF0C\u8ACB\u4E00\u5206\u9418\u5F8C\u518D\u8A66") : tx("\u9001\u51FA\u5931\u6557\uFF0C\u8ACB\u7A0D\u5F8C\u518D\u8A66"));
          t.disabled = false;
        });
        return;
      }
    }
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && app.modal) closeModal();
  });
  function settleOffline() {
    const r = offlineProgress(app.S);
    if (!r || !r.runs) return;
    save();
    const hrs = r.sec >= 3600 ? tx("{0} \u5C0F\u6642", (r.sec / 3600).toFixed(1)) : tx("{0} \u5206\u9418", Math.round(r.sec / 60));
    openModal({ type: "text", html: tx('<h3>\u96E2\u7DDA\u6536\u76CA</h3><p class="sub" style="margin:0">\u4F60\u96E2\u958B\u4E86 {0}\uFF0C\u968A\u4F0D\u5728 {1} \u6301\u7E8C\u4F5C\u6230\u3002</p> <div class="statgrid num"><div><b>{2}</b><span>\u6311\u6230</span></div><div><b>{3}</b><span>\u901A\u95DC</span></div><div><b>+{4}</b><span>\u91D1\u5E63</span></div><div><b>{5}</b><span>\u88DD\u5099</span></div></div> {6} {7} <div class="row"><button class="btn main grow" data-act="autoequip">\u4E00\u9375\u914D\u88DD</button><button class="btn" data-act="closebtn">\u597D</button></div>', hrs, app.S.idleMythic != null ? tx("\u79D8\u5883\u300C{0}\u300D+{1}", DUNGEONS[app.S.idleMythic].name, mythicIdleLevel(app.S, app.S.idleMythic)) : DUNGEONS[app.S.idle].name, r.runs, r.wins, fmt(r.gold), r.items, r.stashed ? tx('<div style="color:var(--brass)">\u80CC\u5305\u5DF2\u6EFF\uFF0C{0} \u4EF6\u653E\u9032\u6230\u5229\u54C1\u7BB1\uFF0C\u5230\u80CC\u5305\u53D6\u51FA</div>', r.stashed) : "", r.lv ? tx('<div style="color:var(--good)">\u671F\u9593\u5171\u5347\u7D1A {0} \u6B21</div>', r.lv) : "") });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(app.bTimer);
      clearTimeout(app.pendingRepeat);
      app.pendingRepeat = null;
      save();
      if (app.S.player.asked) sendSnapshot(true);
      return;
    }
    if (partyLocked(app.S) && Date.now() - app.S.lastSeen > 6e4) {
      app.battle = null;
      app.lastResult = null;
      settleOffline();
      resumeIdle();
      render();
    } else if (app.battle && !app.battle.over) runTimer();
    else resumeIdle();
  });
  setInterval(() => {
    if (!document.hidden) {
      tick(5);
      save();
    }
  }, 5e3);
  document.addEventListener("input", (e) => {
    if (e.target.id === "fbText") app.fbDraft = e.target.value;
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "salvSel") {
      app.salvSel = +e.target.value;
      app.salvConfirm = false;
      render();
    }
    if (e.target.id === "fireSel") {
      app.fireSel = +e.target.value;
      app.fireConfirm = false;
      render();
    }
  });
  function showDraw(list, cost) {
    const sorted = [...list].sort((a, b) => (b.rarity || 0) - (a.rarity || 0)), best = sorted[0].rarity || 0;
    openModal({ type: "text", html: tx('<h3>{0}</h3> <p class="sub" style="margin:0">\u82B1\u8CBB {1} \u91D1\u30FB\u5DF2\u52A0\u5165\u540D\u518A{2}</p> <div class="drawlist">{3}</div> <div class="row"><button class="btn main grow" data-act="closebtn">\u597D</button><button class="btn" data-tab="team">\u53BB\u5718\u968A\u770B\u770B</button></div>', best === 4 ? tx("\u2728 \u50B3\u8AAA\u964D\u81E8\uFF01") : best === 3 ? tx("\u53F2\u8A69\u82F1\u96C4\u52A0\u5165\uFF01") : tx("\u62DB\u52DF\u7D50\u679C"), fmt(cost), app.S.party.length < ECONOMY.partyMax ? "" : tx("\uFF08\u968A\u4F0D\u5DF2\u6EFF\uFF0C\u5728\u5F85\u547D\u5340\uFF09"), sorted.map((x) => `<div class="drawcard r-${x.rarity || 0}"><span class="ic">${CLASSES[x.cls].icon}</span><span>${heroName(x)}</span><span class="rtag r${x.rarity || 0}">${HERO_RARITY[x.rarity || 0].name}</span><small>${CLASSES[x.cls].name}\u30FBLv${x.level}</small>${x.legend ? tx('<small class="c4">{0}\uFF1A{1}</small>', LEGENDS[x.cls].pname, LEGENDS[x.cls].desc) : ""}</div>`).join("")) });
  }
  function openNick() {
    openModal({ type: "text", html: tx('<h3>\u4F60\u7684\u66B1\u7A31</h3><p class="sub" style="margin:0">\u986F\u793A\u5728\u5929\u68AF\u4E0A\uFF0C\u4E4B\u5F8C\u96A8\u6642\u53EF\u4EE5\u4FEE\u6539\u3002\u904A\u6232\u6703\u8A18\u9304\u66B1\u7A31\u3001\u9032\u5EA6\u8207\u904A\u73A9\u6642\u9593\uFF0C\u4E0D\u6703\u6536\u96C6\u5E33\u865F\u6216\u500B\u4EBA\u8CC7\u6599\u3002</p> <input id="nickInp" class="inp" maxlength="16" placeholder="\u4F8B\u5982\uFF1AYomi" value="{0}" autocomplete="off"> <div class="row"><button class="btn main grow" data-act="savenick">\u78BA\u5B9A</button><button class="btn" data-act="skipnick">\u533F\u540D\u53C3\u52A0</button></div>', esc(app.S.player.name)) });
  }
  for (const ev of ["gesturestart", "gesturechange"]) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  function start(data) {
    const saved = data && data.S || load();
    app.S = migrate(saved || newGame());
    app.fresh = !saved;
    for (const h of [...app.S.heroes, ...app.S.tavern || []]) h.name = localName(h.name);
    for (const it of Object.values(app.S.items)) it.name = localName(it.name);
    $(".brand-t").textContent = tx("\u526F\u672C\u5718\u9577");
    $(".brand").setAttribute("aria-label", tx("\u8A2D\u5B9A"));
    $("#idleChip").textContent = tx("\u639B\u6A5F\u4E2D");
    document.title = tx("\u526F\u672C\u5718\u9577");
    document.documentElement.lang = getLang();
    settleOffline();
    resumeIdle();
    render();
    const after = () => {
      if (enabled() && !app.S.player.asked && !app.modal) openNick();
      else if (app.S.player.asked) setTimeout(() => sendSnapshot(), 3e3);
    };
    showTitle(!saved, () => {
      app.fresh = false;
      save();
      return !saved ? playDialog(PROLOGUE, after) : after();
    });
  }
  function showTitle(fresh, onGo) {
    let seen = false;
    try {
      seen = sessionStorage.getItem("rl-title") === "1";
    } catch (e) {
    }
    if (seen) {
      onGo();
      return;
    }
    const el = document.createElement("div");
    el.id = "title";
    el.innerHTML = `<div class="tbox"><div class="tlogo">${tx("\u526F\u672C\u5718\u9577")}</div>${getLang() === "en" ? "" : '<div class="tsub">RAID LEADER</div>'}
    <p class="ttag">${tx("\u5E36\u9818\u4F60\u7684\u5192\u96AA\u5718\uFF0C\u653B\u4E0B\u6BCF\u4E00\u5EA7\u526F\u672C\u3002")}</p>
    <button class="btn main tgo" data-act="titlego">${fresh ? tx("\u958B\u59CB\u5192\u96AA") : tx("\u7E7C\u7E8C\u5192\u96AA")}</button>
    <div class="seg tlang">${LANGS.map((l) => `<button data-act="lang" data-v="${l.id}" class="${l.id === getLang() ? "sel" : ""}">${l.name}</button>`).join("")}</div>
    <div class="sub num tver">v${VERSION}</div></div>`;
    document.body.appendChild(el);
    el.addEventListener("click", (e) => {
      if (!e.target.closest('[data-act="titlego"]')) return;
      try {
        sessionStorage.setItem("rl-title", "1");
      } catch (err) {
      }
      el.classList.add("out");
      setTimeout(() => el.remove(), 260);
      onGo();
    });
  }
  window.claude?.hot?.snapshot?.(() => ({ S: app.S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  function stopIdleFor(d) {
    const m = app.S.idleMythic != null, i = app.S.idle != null && app.S.idle !== d;
    if (!m && !i) return;
    app.S.idleMythic = null;
    if (i) app.S.idle = null;
    clearTimeout(app.pendingRepeat);
    app.pendingRepeat = null;
    toast(tx("\u5DF2\u505C\u6B62\u639B\u6A5F"));
    save();
  }
  function storyOnce(keys, done) {
    const seen = app.S.story.seen, todo = [].concat(keys).filter((k) => STORY[k] && !seen.includes(k));
    if (!todo.length) return false;
    seen.push(...todo);
    save();
    playDialog(todo.flatMap((k) => STORY[k]), done || (() => {
    }));
    return true;
  }
  app.storyOnce = storyOnce;
  function resumeIdle() {
    if (app.S.idleMythic != null && mythicIdleLevel(app.S, app.S.idleMythic)) startMythicIdle(app.S.idleMythic);
    else if (app.S.idle != null && app.S.clears[app.S.idle]) startBattle(app.S.idle);
  }
  function prepMsg(r, what) {
    const roles = tx("\u5766 {0}\u30FB\u88DC {1}\u30FB\u8F38\u51FA {2}", r.roles.tank, r.roles.heal, r.roles.dps), gear = r.swapped ? tx("\uFF0C\u63DB\u4E0A {0} \u4EF6\u88DD\u5099", r.swapped) : "";
    return r.locked ? tx("\u639B\u6A5F\u4E2D\u4E0D\u63DB\u9663\u5BB9\uFF0C\u5DF2\u4F9D{0}\u8ABF\u6574\u5929\u8CE6{1}", what, gear) : tx("\u5DF2\u4F9D{0}\u5099\u6230\uFF1A{1}{2}", what, roles, gear);
  }
  function gearMsg(g) {
    if (!g) return "";
    const n = g.bag + g.stash + g.salvaged;
    if (!n) return "";
    return tx("\uFF1B\u5378\u4E0B {0} \u4EF6\u88DD\u5099{1}{2}", n, g.stash ? tx("\uFF08{0} \u4EF6\u9032\u6230\u5229\u54C1\u7BB1\uFF09", g.stash) : "", g.salvaged ? tx("\uFF08{0} \u4EF6\u653E\u4E0D\u4E0B\u5DF2\u5206\u89E3 +{1} \u91D1\uFF09", g.salvaged, fmt(g.gold)) : "");
  }
})();
</script>
