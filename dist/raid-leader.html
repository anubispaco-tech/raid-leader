<title>副本團長</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 手機優先的「公會作戰桌」——頂部資源列、單欄內容、底部分頁列；刻意單一深色主題（夜間火把下的石板＋黃銅） */
:root{
  color-scheme: dark;
  --bg:#12161d; --panel:#1b212b; --panel2:#222a36; --line:#2e3846; --fg:#e8e2d2; --muted:#8e97a6; --dim:#5d6676;
  --brass:#d0a44c; --brass-d:#8a6a2a; --ink:#12161d;
  --tank:#5d8ff0; --heal:#4fc17f; --dps:#e3664f; --warn:#f0b54a; --bad:#e5534b; --good:#57c78a;
  --r0:#9ca3af; --r1:#38c172; --r2:#4b8df5; --r3:#b46cf2;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%, #2a2416 0%, transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 150px}

/* 頂部資源列 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.08em;color:var(--brass);white-space:nowrap}
.res{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
.res .pill{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.coin{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,var(--brass) 60%,var(--brass-d))}
.idlechip{font-size:12px;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 50%,transparent);border-radius:999px;padding:2px 8px;white-space:nowrap}
.idlechip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:22px 0 4px;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* 副本卡 */
.dlist{display:grid;gap:10px}
.dg{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px}
.dg.locked{opacity:.45}
.dg .tier{grid-row:span 3;font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--brass);text-align:center;line-height:1;padding-top:4px;border-right:1px solid var(--line)}
.dg .tier small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-top:4px}
.dg h3{margin:0;font-size:17px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dg h3 .boss{font-size:13px;color:var(--muted);font-weight:500}
.dg .tip{font-size:13px;color:var(--fg);opacity:.85}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:500}
.meta .ok{color:var(--good)} .meta .low{color:var(--warn)}
.dg .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--dim)}
.btn.main{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
.btn.main:hover{filter:brightness(1.08)}
.btn.on{border-color:var(--good);color:var(--good)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.grow{flex:1}

/* 戰鬥 */
.bhead{display:flex;align-items:center;gap:10px;margin-top:16px}
.bhead h2{margin:0;font-size:19px}
.waves{display:flex;gap:4px;margin-left:auto}
.waves i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.waves i.done{background:var(--brass-d)} .waves i.cur{background:var(--brass)}
.arena{display:grid;gap:14px;margin-top:12px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.unit{display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px;align-items:center}
.unit .ic{grid-row:span 2;font-size:18px;text-align:center}
.unit .nm{font-size:13px;display:flex;gap:6px;align-items:baseline}
.unit .nm small{color:var(--muted);font-size:11px}
.unit .hpn{font-size:11px;color:var(--muted)}
.bar{grid-column:2/-1;height:8px;background:#0d1015;border-radius:4px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .25s}
.unit.dead{opacity:.35}
.unit.boss .bar{height:12px}
.role-tank{background:var(--tank)} .role-heal{background:var(--heal)} .role-dps{background:var(--dps)}
.enemy-bar{background:linear-gradient(90deg,#9b3a2e,var(--bad))}
.log{margin-top:12px;background:#0e1117;border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:150px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.log p{margin:0;color:var(--muted)} .log .t{font-family:var(--f-num);color:var(--dim);margin-right:6px}
.log .good{color:var(--good)} .log .bad{color:var(--bad)} .log .warn{color:var(--warn)} .log .info{color:var(--brass)}
.ctrl{display:flex;gap:6px;flex-wrap:nowrap;max-width:560px;margin:0 auto;padding:0 16px}
.ctrl .btn{flex:1;white-space:nowrap}
/* 戰鬥控制列固定在分頁列上方，不隨戰鬥內容位移 */
.ctrlbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5;padding:8px 0;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.side.foes{min-height:calc(26px + 4 * 34px);align-content:start}
.more{font-size:12px;color:var(--muted);padding-left:34px}
.stashbox{background:var(--panel);border:1px solid var(--brass-d);border-radius:10px;padding:12px;display:grid;gap:10px;margin-bottom:12px}
.settings{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;font-size:14px}
.warnc{color:var(--warn)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;font-family:var(--f-num)}
.seg button.sel{background:var(--brass);color:var(--ink);font-weight:700}

.result{background:var(--panel);border:1px solid var(--brass-d);border-radius:12px;padding:16px;margin-top:14px;display:grid;gap:12px}
.result h3{margin:0;font-family:var(--f-display);font-size:24px}
.result.win h3{color:var(--brass)} .result.lose h3{color:var(--bad)}
.rew{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.meter{display:grid;gap:5px}
.mrow{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.mrow .mb{height:14px;background:#0d1015;border-radius:3px;overflow:hidden}
.mrow .mb i{display:block;height:100%}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:10px;margin-top:16px}

/* 團隊 */
.party{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.slot.emptyslot{border-style:dashed;color:var(--dim);display:grid;place-items:center;font-size:12px}
.slot .ic{font-size:22px}
.slot .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .lv{font-size:11px;color:var(--muted)}
.slot .rl{height:3px;border-radius:2px;margin:6px 8px 0}
.comp{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:8px 0 0;flex-wrap:wrap}
.comp b{font-weight:500}
.hero{display:grid;grid-template-columns:36px 1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.hero .ic{grid-row:span 2;font-size:22px;text-align:center}
.hero .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hero .nm small{font-weight:400;color:var(--muted);font-size:12px}
.hero .st{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.hero .tag{grid-row:span 2;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.hero .tag.in{border-color:var(--brass-d);color:var(--brass)}
.stack{display:grid;gap:8px}
.xpbar{height:3px;background:#0d1015;border-radius:2px;overflow:hidden;grid-column:2/-1;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--brass-d)}

/* 背包 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:9px 12px;text-align:left;width:100%}
.item .in{font-weight:500;font-size:14px}
.item .is{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.item .il{grid-row:span 2;align-self:center;font-size:12px;color:var(--muted);text-align:right}
.item .il b{display:block;font-size:16px;color:var(--fg)}
.rar0{border-left-color:var(--r0)} .rar1{border-left-color:var(--r1)} .rar2{border-left-color:var(--r2)} .rar3{border-left-color:var(--r3)}
.c0{color:var(--r0)} .c1{color:var(--r1)} .c2{color:var(--r2)} .c3{color:var(--r3)}
.up{color:var(--brass);font-family:var(--f-num);font-size:12px;margin-left:4px}
.better{color:var(--good);font-size:11px;font-weight:700;margin-left:6px}

/* 底部分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{padding:9px 0 8px;font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:2px;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabs button.sel{color:var(--brass)}
.tabs button .dot{position:absolute;top:6px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--good)}

/* 底部抽屜 */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:86%;overflow-y:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0;font-family:var(--f-display);font-size:21px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.statgrid div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
.statgrid b{display:block;font-size:16px}
.statgrid span{font-size:11px;color:var(--muted)}
.gearrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gearrow .sl{font-size:12px;color:var(--muted)}
.choices{display:grid;gap:6px;max-height:260px;overflow-y:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--brass-d);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20;white-space:nowrap;animation:rise .2s}
textarea{width:100%;min-height:90px;font-size:16px!important;background:#0e1117;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-num);font-size:11px}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.howto b{color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app">
  <header class="top">
    <div class="brand">副本團長</div>
    <div class="res">
      <span id="idleChip" class="idlechip" hidden>掛機中</span>
      <span class="pill num"><i class="coin"></i><span id="gold">0</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="tabs"><nav id="tabs"></nav></div>
<div id="modal"></div>
<div id="toast"></div>

  function unequip(s, heroId, slot) {
    const h = s.heroes.find((x) => x.id === heroId);
    if (!h || !h.gear[slot]) return;
    s.bag.push(h.gear[slot]);
    h.gear[slot] = null;
  }
  function salvage(s, itemId) {
    const it = s.items[itemId];
    if (!it) return 0;
    s.bag = s.bag.filter((id) => id !== itemId);
    s.stash = (s.stash || []).filter((id) => id !== itemId);
    delete s.items[itemId];
    const v = salvageValue(it);
    s.gold += v;
    return v;
  }
  function salvageUpTo(s, maxRarity) {
    const ids = s.bag.filter((i) => s.items[i].rarity <= maxRarity);
    return { count: ids.length, gold: ids.reduce((g, i) => g + salvage(s, i), 0) };
  }
  function takeFromStash(s) {
    const room = ECONOMY.bagMax - s.bag.length;
    const ids = [...s.stash].sort((a, b) => itemScore(s.items[b]) - itemScore(s.items[a])).slice(0, Math.max(0, room));
    s.stash = s.stash.filter((id) => !ids.includes(id));
    s.bag.push(...ids);
    return ids.length;
  }
  function salvageStash(s) {
    const gold = s.stash.reduce((g, id) => {
      const v = salvageValue(s.items[id]);
      delete s.items[id];
      return g + v;
    }, 0);
    const count = s.stash.length;
    s.stash = [];
    s.gold += gold;
    return { count, gold };
  }
  function upgrade(s, itemId) {
    const it = s.items[itemId];
    if (!it || it.up >= GEAR.maxUp) return false;
    const c = upgradeCost(it);
    if (s.gold < c) return false;
    s.gold -= c;
    it.up++;

  }
  function autoEquip(s) {
    let changed = 0;
    for (const h of partyHeroes(s)) {
      for (const slot of Object.keys(SLOTS)) {
        const cur = h.gear[slot] && s.items[h.gear[slot]];
        let best = null;
        for (const id of s.bag) {
          const it = s.items[id];
          if (it.slot === slot && (!best || itemScore(it) > itemScore(best))) best = it;
        }
        if (best && (!cur || itemScore(best) > itemScore(cur))) {
          equip(s, h.id, best.id);
          changed++;

      }
    }

  }
  function offlineProgress(s, now = Date.now()) {
    if (s.idle == null || !s.clears[s.idle]) {

    const sec = Math.min(ECONOMY.offlineCapHours * 3600, Math.max(0, (now - s.lastSeen) / 1e3));
    s.lastSeen = now;
    if (sec < 60 || !partyHeroes(s).length) return null;
    let t = 0, runs = 0, wins = 0, gold = 0, items = 0, stashed = 0, lv = 0;
    while (runs < 400) {
      const b = new Battle(partyHeroes(s), s.items, s.idle).runToEnd();
      t += b.tick + 5;
      if (t > sec) break;
      const r = applyResult(s, s.idle, b);
      runs++;
      if (b.win) wins++;
      gold += r.gold;
      items += r.kept.length;
      stashed += r.stashed.length;
      lv += r.lvUps.length;
    }
    return { sec: Math.round(sec), runs, wins, gold, items, stashed, lv };
  }

  // src/ui/views/sheets.js

    app.modal = null;
    renderModal();
  }
  function renderModal() {
    const el = $("#modal");
    if (!app.modal) {
      el.innerHTML = "";
      return;
    }
    let body = "";
    if (app.modal.type === "hero") body = sheetHero(hero(app.modal.id));
    if (app.modal.type === "item") body = sheetItem(app.S.items[app.modal.id]);
    if (app.modal.type === "pick") body = sheetPick();
    if (app.modal.type === "text") body = app.modal.html;
    if (!body) {
      app.modal = null;
      el.innerHTML = "";

    el.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
  }
  function sheetHero(x) {
    if (!x) return "";

    let h = `<h3>${c.icon} ${x.name}</h3><div class="sub" style="margin:0">${c.name}\u30FB${ROLE_NAME[c.role]}\u3000${c.desc}</div>

    <div class="sub" style="margin:0">\u7D93\u9A57 <span class="num">${fmt(x.xp)} / ${fmt(xpNeed(x.level))}</span>\u30FB\u8B77\u7532\u6E1B\u50B7 ${Math.round(st.armor * 100)}%</div><div>`;
    for (const [slot, sn] of Object.entries(SLOTS)) {
      const it = x.gear[slot] && app.S.items[x.gear[slot]];

      h += `<div class="gearrow"><span class="sl">${sn}</span><span>${it ? `${itemName(it)} <span class="sub num">${it.ilvl}</span><br><span class="sub num" style="font-size:12px">${itemStatText(it)}</span>` : '<span class="sub">\uFF08\u7A7A\uFF09</span>'}</span>
      <span class="row">${it ? `<button class="btn sm" data-act="up" data-id="${it.id}" ${it.up >= GEAR.maxUp ? "disabled" : ""}>\u5F37\u5316 <span class="num">${it.up >= GEAR.maxUp ? "MAX" : upgradeCost(it)}</span></button>` : ""}

    }
    h += `</div><div class="row">${inParty(x) ? `<button class="btn grow" data-act="bench" data-id="${x.id}">\u79FB\u51FA\u968A\u4F0D</button>` : `<button class="btn main grow" data-act="join" data-id="${x.id}" ${app.S.party.length >= ECONOMY.partyMax ? "disabled" : ""}>${app.S.party.length >= ECONOMY.partyMax ? "\u968A\u4F0D\u5DF2\u6EFF" : "\u52A0\u5165\u968A\u4F0D"}</button>`}
    ${app.S.heroes.length > 1 ? `<button class="btn" data-act="fire" data-id="${x.id}" style="color:var(--bad)">${app.modal.confirmFire ? "\u78BA\u5B9A\u89E3\u96C7\uFF1F" : "\u89E3\u96C7"}</button>` : ""}</div>`;
    return h;

  function sheetPick() {
    const x = hero(app.modal.id), slot = app.modal.slot, cur = x.gear[slot] && app.S.items[x.gear[slot]];

    <div class="choices">${list.map((it) => `<button class="item rar${it.rarity}" data-act="equip" data-hero="${x.id}" data-id="${it.id}"><div class="in">${itemName(it)}${!cur || itemScore(it) > itemScore(cur) ? '<span class="better">\u25B2</span>' : ""}</div><div class="il"><b class="num">${it.ilvl}</b></div><div class="is num">${itemStatText(it)}</div></button>`).join("")}</div>
    <div class="row">${cur ? `<button class="btn" data-act="unequip" data-hero="${x.id}" data-slot="${slot}">\u5378\u4E0B</button>` : ""}<button class="btn" data-act="hero" data-id="${x.id}">\u8FD4\u56DE</button></div>`;

    <span class="label">\u88DD\u5099\u7D66</span><div class="stack">${party.map((x) => {
      const cur = x.gear[it.slot] && app.S.items[x.gear[it.slot]];

    <button class="btn" data-act="salvage" data-id="${it.id}">\u5206\u89E3 +<span class="num">${salvageValue(it)}</span> \u91D1</button></div>`;

  // src/ui/battle-runner.js
  function startBattle(dIdx) {
    const p = partyHeroes(app.S);
    if (!p.length) {
      toast("\u968A\u4F0D\u6C92\u6709\u6210\u54E1");
      app.tab = "team";
      app.render();
      return;
    }
    clearTimeout(app.pendingRepeat);
    app.pendingRepeat = null;
    app.battle = new Battle(p, app.S.items, dIdx);
    app.lastResult = null;
    app.battle.push(`\u9032\u5165 ${DUNGEONS[dIdx].name}\uFF0C\u7B2C 1 \u6CE2\u6575\u4EBA\u51FA\u73FE`, "info");
    runTimer();
  }
  function runTimer() {
    clearInterval(app.bTimer);
    app.bTimer = setInterval(stepBattle, TICK_MS / app.speed);
  }
  function stepBattle() {
    if (!app.battle || app.battle.over) {
      clearInterval(app.bTimer);
      return;
    }
    app.battle.step();
    if (app.battle.over) finishBattle();
    else if (app.tab === "battle") app.render(true);
    else app.renderTabs();
  }
  function finishBattle() {
    clearInterval(app.bTimer);
    app.lastResult = applyResult(app.S, app.battle.dIdx, app.battle);
    save();
    if (app.S.idle === app.battle.dIdx) {
      const d = app.battle.dIdx;
      app.pendingRepeat = setTimeout(() => {
        app.pendingRepeat = null;
        if (app.S.idle === d) startBattle(d);
      }, 3e3);
    }
    app.render(true);
  }

  // src/ui/main.js
  var ICONS = {
    dungeon: '<path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6a3 3 0 0 1 6 0v6"/>',
    battle: '<path d="M5 19 19 5M14 5h5v5M5 14l5 5M4 20l3-3"/>',
    team: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19c.6-3.4 3-5 6-5s5.4 1.6 6 5M15 14.5c2.6-.3 4.8 1.2 5.5 4.5"/>',
    bag: '<path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    tavern: '<path d="M6 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M16 5h2a2 2 0 0 1 0 4h-2M11 13v4M7 20h8"/>'
  };
  var TABS = [["dungeon", "\u526F\u672C"], ["battle", "\u6230\u9B25"], ["team", "\u5718\u968A"], ["bag", "\u80CC\u5305"], ["tavern", "\u9152\u9928"]];
  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" class="${app.tab === k ? "sel" : ""}" aria-label="${n}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${n}${k === "battle" && app.battle && !app.battle.over && app.tab !== "battle" || k === "bag" && app.S.stash.length ? '<span class="dot"></span>' : ""}</button>`).join("");
  }
  function render(skipModal) {
    $("#gold").textContent = fmt(app.S.gold);
    $("#idleChip").hidden = app.S.idle == null;
    renderTabs();
    const v = $("#view");
    if (app.tab === "dungeon") v.innerHTML = viewDungeons();
    if (app.tab === "battle") v.innerHTML = viewBattle();
    if (app.tab === "team") v.innerHTML = viewTeam();
    if (app.tab === "bag") v.innerHTML = viewBag();
    if (app.tab === "tavern") v.innerHTML = viewTavern();
    if (app.tab === "battle") {
      const lg = $(".log");
      if (lg) lg.scrollTop = lg.scrollHeight;
    }
    if (!skipModal) renderModal();
  }
  app.render = render;
  app.renderTabs = renderTabs;
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab],[data-act]");
    if (!t) return;
    if (t.dataset.act === "close") {
      if (e.target === t) closeModal();
      return;
    }
    if (t.dataset.tab) {
      app.tab = t.dataset.tab;
      app.modal = null;
      render();
      window.scrollTo(0, 0);
      return;
    }
    const a = t.dataset.act, id = t.dataset.id;
    switch (a) {
      case "fight":
        startBattle(+t.dataset.d);
        app.tab = "battle";
        break;
      case "idle": {
        const d = +t.dataset.d;
        if (app.S.idle === d) {
          app.S.idle = null;
          clearTimeout(app.pendingRepeat);
          app.pendingRepeat = null;
          toast("\u5DF2\u505C\u6B62\u639B\u6A5F");
        } else {
          app.S.idle = d;
          toast(`\u958B\u59CB\u639B\u6A5F\uFF1A${DUNGEONS[d].name}`);
          if (!app.battle || app.battle.over) {
            startBattle(d);
          }
        }
        save();
        break;
      }
      case "speed":
        app.speed = +t.dataset.x;
        runTimer();
        break;
      case "skip":
        if (app.battle && !app.battle.over) {
          app.battle.runToEnd();
          finishBattle();
        }
        break;
      case "retreat":
        if (app.battle && !app.battle.over) {
          clearInterval(app.bTimer);
          app.battle.over = true;
          app.battle.win = false;
          app.battle.push("\u{1F3F3} \u4E3B\u52D5\u64A4\u9000", "bad");
          app.lastResult = applyResult(app.S, app.battle.dIdx, app.battle);
          if (app.S.idle === app.battle.dIdx) app.S.idle = null;
          save();
        }
        break;
      case "hero":
        openModal({ type: "hero", id });
        return;
      case "item":
        openModal({ type: "item", id });
        return;
      case "pick":
        openModal({ type: "pick", id, slot: t.dataset.slot });
        return;
      case "equip":
        equip(app.S, t.dataset.hero, id);
        toast("\u5DF2\u88DD\u5099");
        save();
        app.modal = { type: "hero", id: t.dataset.hero };
        break;
      case "unequip":
        unequip(app.S, t.dataset.hero, t.dataset.slot);
        save();
        app.modal = { type: "hero", id: t.dataset.hero };
        break;
      case "up":
        if (upgrade(app.S, id)) {
          toast("\u5F37\u5316\u6210\u529F");
          save();
        } else toast("\u91D1\u5E63\u4E0D\u8DB3");
        break;
      case "salvage":
        toast(`\u5206\u89E3\u7372\u5F97 ${salvage(app.S, id)} \u91D1`);
        save();
        app.modal = null;
        break;
      case "join":
        joinParty(app.S, id);
        save();
        break;
      case "bench":
        benchHero(app.S, id);
        save();
        break;
      case "fire": {
        if (!app.modal.confirmFire) {
          app.modal.confirmFire = true;
          break;
        }
        const x = fireHero(app.S, id);
        app.modal = null;
        if (x) toast(`${x.name} \u96E2\u958B\u4E86\u5718\u968A`);
        save();
        break;
      }
      case "hire": {
        const x = hire(app.S, id);
        if (x) {
          toast(`${x.name} \u52A0\u5165\u4E86${app.S.party.includes(x.id) ? "\u968A\u4F0D" : "\u540D\u518A"}`);
          save();
        }
        break;
      }
      case "reroll":
        if (refreshTavern(app.S)) save();
        break;
      case "filter":
        app.invFilter = t.dataset.v;
        break;
      case "autoequip": {
        const n = autoEquip(app.S);
        toast(n ? `\u66F4\u63DB\u4E86 ${n} \u4EF6\u88DD\u5099` : "\u76EE\u524D\u5DF2\u662F\u6700\u4F73\u914D\u88DD");
        save();
        break;
      }
      case "salvageupto": {
        const r = salvageUpTo(app.S, +t.dataset.v);
        toast(r.count ? `\u5206\u89E3 ${r.count} \u4EF6\uFF0C\u7372\u5F97 ${r.gold} \u91D1` : "\u6C92\u6709\u53EF\u5206\u89E3\u7684\u88DD\u5099");
        save();
        break;
      }
      case "autosalv":
        app.S.autoSalvageBelow = +t.dataset.v;
        save();
        break;
      case "keeprar":
        app.S.keepRarity = +t.dataset.v;
        save();
        break;
      case "takestash": {
        const n = takeFromStash(app.S);
        toast(n ? `\u53D6\u51FA ${n} \u4EF6` : "\u80CC\u5305\u5DF2\u6EFF");
        save();
        break;
      }
      case "salvagestash": {
        const r = salvageStash(app.S);
        toast(`\u5206\u89E3 ${r.count} \u4EF6\uFF0C\u7372\u5F97 ${r.gold} \u91D1`);
        save();
        break;
      }
      case "export":
        openModal({ type: "text", html: `<h3>\u532F\u51FA\u5B58\u6A94\u78BC</h3><p class="sub" style="margin:0">\u8907\u88FD\u9019\u6BB5\u6587\u5B57\uFF0C\u5230\u53E6\u4E00\u53F0\u88DD\u7F6E\u7684\u300C\u532F\u5165\u300D\u8CBC\u4E0A\u3002</p><textarea id="expTxt" readonly>${exportCode()}</textarea><div class="row"><button class="btn main" data-act="copy">\u8907\u88FD</button><button class="btn" data-act="closebtn">\u95DC\u9589</button></div>` });
        return;
      case "copy": {
        const ta = $("#expTxt");
        navigator.clipboard?.writeText(ta.value).then(() => toast("\u5DF2\u8907\u88FD"), () => {
          ta.select();
          toast("\u8ACB\u624B\u52D5\u8907\u88FD");
        }) ?? (ta.select(), toast("\u8ACB\u624B\u52D5\u8907\u88FD"));
        return;
      }
      case "import":
        openModal({ type: "text", html: `<h3>\u532F\u5165\u5B58\u6A94\u78BC</h3><p class="sub" style="margin:0">\u6703\u8986\u84CB\u76EE\u524D\u9032\u5EA6\u3002</p><textarea id="impTxt" placeholder="\u8CBC\u4E0A\u5B58\u6A94\u78BC"></textarea><div class="row"><button class="btn main" data-act="doimport">\u532F\u5165</button><button class="btn" data-act="closebtn">\u53D6\u6D88</button></div>` });
        return;
      case "doimport":
        try {
          app.S = importCode($("#impTxt").value);
          app.battle = null;
          save();
          app.modal = null;
          toast("\u532F\u5165\u5B8C\u6210");
        } catch (err) {
          toast("\u5B58\u6A94\u78BC\u7121\u6CD5\u8B80\u53D6\uFF0C\u8ACB\u78BA\u8A8D\u662F\u5426\u5B8C\u6574\u8907\u88FD");
          return;
        }
        break;
      case "reset":
        openModal({ type: "text", html: `<h3>\u91CD\u65B0\u958B\u59CB\uFF1F</h3><p class="sub" style="margin:0">\u76EE\u524D\u7684\u82F1\u96C4\u3001\u88DD\u5099\u8207\u9032\u5EA6\u90FD\u6703\u6E05\u9664\uFF0C\u7121\u6CD5\u5FA9\u539F\u3002</p><div class="row"><button class="btn" data-act="doreset" style="color:var(--bad);border-color:var(--bad)">\u6E05\u9664\u4E26\u91CD\u4F86</button><button class="btn" data-act="closebtn">\u53D6\u6D88</button></div>` });
        return;
      case "doreset":
        clearInterval(app.bTimer);
        clearTimeout(app.pendingRepeat);
        app.S = newGame();
        app.battle = null;
        app.lastResult = null;
        app.modal = null;
        app.tab = "dungeon";
        save();
        break;
      case "closebtn":
        app.modal = null;
        break;
    }
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && app.modal) closeModal();
  });
  function settleOffline() {
    const r = offlineProgress(app.S);
    if (!r || !r.runs) return;
    save();
    const hrs = r.sec >= 3600 ? `${(r.sec / 3600).toFixed(1)} \u5C0F\u6642` : `${Math.round(r.sec / 60)} \u5206\u9418`;
    openModal({ type: "text", html: `<h3>\u96E2\u7DDA\u6536\u76CA</h3><p class="sub" style="margin:0">\u4F60\u96E2\u958B\u4E86 ${hrs}\uFF0C\u968A\u4F0D\u5728 ${DUNGEONS[app.S.idle].name} \u6301\u7E8C\u4F5C\u6230\u3002</p>
    <div class="statgrid num"><div><b>${r.runs}</b><span>\u6311\u6230</span></div><div><b>${r.wins}</b><span>\u901A\u95DC</span></div><div><b>+${fmt(r.gold)}</b><span>\u91D1\u5E63</span></div><div><b>${r.items}</b><span>\u88DD\u5099</span></div></div>
    ${r.stashed ? `<div style="color:var(--brass)">\u80CC\u5305\u5DF2\u6EFF\uFF0C${r.stashed} \u4EF6\u653E\u9032\u6230\u5229\u54C1\u7BB1\uFF0C\u5230\u80CC\u5305\u53D6\u51FA</div>` : ""}
    ${r.lv ? `<div style="color:var(--good)">\u671F\u9593\u5171\u5347\u7D1A ${r.lv} \u6B21</div>` : ""}
    <div class="row"><button class="btn main grow" data-act="autoequip">\u4E00\u9375\u914D\u88DD</button><button class="btn" data-act="closebtn">\u597D</button></div>` });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(app.bTimer);
      clearTimeout(app.pendingRepeat);
      app.pendingRepeat = null;
      save();
      return;
    }
    if (app.S.idle != null && Date.now() - app.S.lastSeen > 6e4) {
      app.battle = null;
      app.lastResult = null;
      settleOffline();
      startBattle(app.S.idle);
      render();
    } else if (app.battle && !app.battle.over) runTimer();
    else if (app.S.idle != null) startBattle(app.S.idle);
  });
  setInterval(() => {
    if (!document.hidden) save();
  }, 5e3);
  for (const ev of ["gesturestart", "gesturechange"]) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  function start(data) {
    app.S = migrate(data && data.S || load() || newGame());
    settleOffline();
    if (app.S.idle != null && app.S.clears[app.S.idle]) startBattle(app.S.idle);
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ S: app.S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
